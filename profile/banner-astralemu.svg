  <circle cx="520" cy="278" r="2" fill="#f5e6a3" opacity="0.4"/>
  <circle cx="680" cy="272" r="1.3" fill="#f5e6a3" opacity="0.5"/>
  <circle cx="800" cy="260" r="1.8" fill="#f5e6a3" opacity="0.6"/>
  <circle cx="920" cy="280" r="1.5" fill="#f5e6a3" opacity="0.4"/>
