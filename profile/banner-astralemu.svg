  <!-- Orbital rings -->
  <ellipse cx="350" cy="150" rx="120" ry="120" fill="none" stroke="#f5e6a3" stroke-width="0.4" opacity="0.08"/>
  <ellipse cx="350" cy="150" rx="90" ry="90" fill="none" stroke="#f5e6a3" stroke-width="0.3" opacity="0.06"/>

  <!-- Logo star - centered left -->
  <g transform="translate(350,150)">
    <!-- Outer layer -->
    <path d="M 0,-95 Q 16,-32 52,-52 Q 32,-16 95,0 Q 32,16 52,52 Q 16,32 0,95 Q -16,32 -52,52 Q -32,16 -95,0 Q -32,-16 -52,-52 Q -16,-32 0,-95 Z" fill="#f2d974"/>
    <!-- Middle layer rotated -->
    <g transform="rotate(45)">
      <path d="M 0,-82 Q 14,-27 44,-44 Q 27,-14 82,0 Q 27,14 44,44 Q 14,27 0,82 Q -14,27 -44,44 Q -27,14 -82,0 Q -27,-14 -44,-44 Q -14,-27 0,-82 Z" fill="#f7e8a0"/>
    </g>
    <!-- Inner layer -->
    <g transform="rotate(22.5)">
      <path d="M 0,-52 Q 9,-17 28,-28 Q 17,-9 52,0 Q 17,9 28,28 Q 9,17 0,52 Q -9,17 -28,28 Q -17,9 -52,0 Q -17,-9 -28,-28 Q -9,-17 0,-52 Z" fill="#faf0c8"/>
    </g>
