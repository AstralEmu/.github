    <circle cx="0" cy="0" r="9" fill="#fdf8e0"/>
  </g>

  <!-- Title text -->
  <text x="530" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#fdf8e0" letter-spacing="4">AstralEmu</text>

  <!-- Subtitle -->
  <text x="533" y="175" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f5e6a3" opacity="0.7" letter-spacing="6">LINUX EMULATION DISTRIBUTION</text>

